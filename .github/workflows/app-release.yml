name: app release

# Every push to the app-release branch builds the full Windows app and publishes it as a GitHub
# Release. (This fork ships Windows only; macOS and Linux stay on the upstream repository.)
# Nothing waits for approval.
#
# The version comes from nsh.json. The build is the Unix time (seconds) of the run: the meta job computes
# it once, and every job stamps it into its own checkout's nsh.json before packaging. The stamp is not
# committed, so nsh.json in git keeps its last hand-set value. A release tag is app-v<version>-b<build>,
# which is unique per run, so the release job never overwrites a release.
# Runs are serialized so two builds never share a second.
#
# Releases are never marked Latest, because the hot-update channel reads the Latest release (see
# hot-update-package.yml).
#
# app-release-incremental builds the same way but restores the Rust build cache, so it compiles
# incrementally. It is a test branch like ci-dryrun: it publishes nothing.
#
# ci-dryrun is a test branch: it builds the package and uploads it as a workflow artifact, but
# publishes nothing.

on:
  push:
    branches: [app-release, app-release-incremental, ci-dryrun]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release-build
  cancel-in-progress: false

env:
  # The apps embed nsh 0.5.1 (Cargo.toml); a newer CLI stamps higher runtime requirements.
  NSH_VERSION: v0.5.1

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and build
        id: meta
        run: |
          version=$(python3 -c 'import json; print(json.load(open("nsh.json"))["version"])')
          build=$(date -u +%s)
          {
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, build $build"

  windows:
    runs-on: windows-latest
    needs: meta
    env:
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the build into nsh.json
        shell: pwsh
        run: |
          $path = Join-Path (Get-Location) 'nsh.json'
          $text = [IO.File]::ReadAllText($path)
          $text = [regex]::Replace($text, '"build":\s*\d+', ('"build": ' + $env:BUILD), 1)
          [IO.File]::WriteAllText($path, $text)
          Select-String -Path $path -Pattern '"build"'

      - name: Restore the nsh CLI cache
        id: nsh-cache
        uses: actions/cache@v4
        with:
          # The installer puts nsh in %LOCALAPPDATA%\nsh, with its runtimes next to bin\nsh.exe.
          path: ~/AppData/Local/nsh
          key: nsh-${{ env.NSH_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Restore the Rust build cache
        # Only the incremental branch reuses compiled artifacts; app-release always builds from scratch.
        if: github.ref == 'refs/heads/app-release-incremental'
        uses: actions/cache@v4
        with:
          # Incremental compilation: the compiled dependencies and the crate's own artifacts.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            runner-windows/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'runner-windows/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the nsh CLI
        if: steps.nsh-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/longbridge/nsh/releases/download/$env:NSH_VERSION/install.ps1" -OutFile "$env:RUNNER_TEMP\install-nsh.ps1"
          & "$env:RUNNER_TEMP\install-nsh.ps1"

      - name: Put the nsh CLI on PATH
        shell: pwsh
        run: |
          # A cache restore does not touch the user PATH, so add the bin directory every run.
          $bin = Join-Path $env:LOCALAPPDATA 'nsh\bin'
          if (-not (Test-Path (Join-Path $bin 'nsh.exe'))) { throw "nsh is not installed at $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'nsh.exe') --version

      - name: Package Windows
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: .nsh/out/release/*.zip
          if-no-files-found: error

  release:
    needs: [meta, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the GitHub Release
        if: github.ref == 'refs/heads/app-release'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="app-v${VERSION}-b${BUILD}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "error: release $tag already exists" >&2
            exit 1
          fi
          gh release create "$tag" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "DiscoveryOS $VERSION (build $BUILD) - app" \
            --notes "Built and published by CI run $RUN_URL"

      - name: Dry run (ci-dryrun publishes nothing)
        if: github.ref != 'refs/heads/app-release'
        run: ls -l assets
